name: AI News Autopilot

on:
  schedule:
    # 毎日 07:00 JST (22:00 UTC 前日)
    - cron: '0 22 * * *'
    # 毎日 12:00 JST (03:00 UTC)
    - cron: '0 3 * * *'
    # 毎日 20:00 JST (11:00 UTC)
    - cron: '0 11 * * *'
    # 毎週月曜 09:00 JST (00:00 UTC)
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  run-news-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run news pipeline
        run: node news.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          DRY_RUN: 'false'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Generate website
        run: node generateSite.js

      - name: Commit and push website
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Actions"
          git add index.html posts/ privacy.html about.html sitemap.xml robots.txt || true
          git diff --staged --quiet || git commit -m "chore: update website [skip ci]"
          git push

      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-data-${{ github.run_id }}
          path: data/*.json
          retention-days: 7
          if-no-files-found: ignore

  # 動画生成は1日1回（夜便）のみ実行してYouTubeにアップロード
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 20:00 JST（11:00 UTC）のみ実行
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 11 * * *'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Japanese fonts
        run: sudo apt-get install -y fonts-noto-cjk

      - name: Generate and upload video
        run: |
          node -e "
            const { generateVideos } = require('./generateVideo.js');
            const { uploadVideo } = require('./uploadYouTube.js');
            const fs = require('fs');
            const path = require('path');

            async function run() {
              const postsFile = path.join(__dirname, 'data', 'posts.json');
              if (!fs.existsSync(postsFile)) {
                console.log('posts.json not found - skip');
                return;
              }
              const posts = JSON.parse(fs.readFileSync(postsFile, 'utf-8'));
              if (!posts.length) { console.log('no posts'); return; }

              const results = await generateVideos(posts, 1);
              for (const r of results) {
                await uploadVideo({
                  videoPath:   r.videoPath,
                  title:       r.title,
                  description: (r.script && r.script.slides ? r.script.slides.map(function(s){ return s.body; }).join('\n') : ''),
                  tags:        ['BIM', 'AEC'],
                });
              }
            }

            run().catch(function(e){ console.error(e.message); process.exit(1); });
          "
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CLOUD_API_KEY: ${{ secrets.GOOGLE_CLOUD_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

  # 週次まとめ記事の自動生成（毎週月曜 09:00 JST = UTC 00:00）
  weekly-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 0 * * 1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate weekly digest
        run: node weeklyDigest.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit and push weekly digest
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Actions"
          git add index.html posts/ data/posts.json || true
          git diff --staged --quiet || git commit -m "feat: add weekly BIM/AEC digest [skip ci]"
          git push
