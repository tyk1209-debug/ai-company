name: Retroactive Japanese Translation

on:
  workflow_dispatch:

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run retroactive Japanese translation
        run: node retroactiveJa.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Regenerate website
        run: node generateSite.js

      - name: Commit and push updated posts.json and site
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Actions"
          git add data/posts.json index.html posts/ categories/ guides/ page/ sitemap.xml robots.txt about.html privacy.html events.html || true
          git diff --staged --quiet || git commit -m "feat: retroactively enrich bodyJa to 1200+ chars with Japan impact section"
          git push
