name: Retroactive Japanese Translation

on:
  workflow_dispatch:

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run retroactive Japanese translation
        run: node retroactiveJa.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit and push updated posts.json and site
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Actions"
          git add data/posts.json index.html posts/ categories/ sitemap.xml robots.txt about.html privacy.html || true
          git diff --staged --quiet || git commit -m "feat: retroactively generate Japanese titles and body for existing articles"
          git push
